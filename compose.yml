services:
  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - veyru-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis/redis-stack-server:7.4.0-v8
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - veyru-redis-data:/data
    environment:
      REDIS_ARGS: --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26.29
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - veyru-neo4j-data:/data
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-veyru-local}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: true
    environment:
      SPRING_PROFILES_ACTIVE: local
      MONGODB_URI: mongodb://mongodb:27017/veyru
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-veyru-local}"
      JWT_SECRET: "${JWT_SECRET:-dmV5cnUtbG9jYWwtZGV2ZWxvcG1lbnQtc2VjcmV0LTEyMzQ=}"
      AUTH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      OAUTH2_REDIRECT_URI: http://localhost:5173/auth/oauth2/redirect
      OAUTH2_FAILURE_REDIRECT_URI: http://localhost:5173/login?error=true
      OPENAPI_SERVER_URL: http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  veyru-mongo-data:
  veyru-redis-data:
  veyru-neo4j-data:
