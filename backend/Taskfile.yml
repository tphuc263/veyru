version: "3"

tasks:
  infra:
    desc: Start local development infrastructure.
    cmds:
      - docker compose -f ../compose.yml up -d mongodb redis neo4j

  format:
    desc: Format Java sources with Spotless.
    cmds:
      - ./mvnw spotless:apply

  format-check:
    desc: Verify Java source formatting.
    cmds:
      - ./mvnw spotless:check
