server:
  forward-headers-strategy: framework

spring:
  application:
    name: veyru-backend
  mongodb:
    uri: ${MONGODB_URI}
  data:
    mongodb:
      auto-index-creation: false
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      repositories:
        enabled: false
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD}
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENTID}
            client-secret: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENTSECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

api:
  prefix: /api/v1

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  secure: true

auth:
  token:
    jwt-secret: ${JWT_SECRET}
    access-expiration: 15m
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}

app:
  frontend:
    url: ${FRONTEND_URL}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI}

ai:
  # Local AI services - no external API required

newsfeed:
  # Heuristic portfolio defaults; these have not been offline-tuned.
  cache:
    affinity-ttl: 5m
    cursor-ttl: 5m
  ranking:
    candidate-limit: 200
    lookback-days: 30
    graph-weight: 0.5
    direct-follow-weight: 0.4
    interaction-weight: 0.35
    mutual-weight: 0.25
    recency-weight: 0.6
    engagement-weight: 0.3
    quality-weight: 0.1
    recency-decay-hours: 72
    engagement-scale: 50

graph:
  reconcile-on-startup: ${GRAPH_RECONCILE_ON_STARTUP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    mongodb:
      enabled: false

open:
  api:
    title: Veyru API
    version: v1.0.0
    description: The flow of moments we see, live, and share.
    server-url: ${OPENAPI_SERVER_URL}
