name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  check-changes:
    name: Check Trigger Conditions
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_deploy: ${{ steps.filter.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Check for backend changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Triggered manually via workflow_dispatch. Proceeding."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif git diff-tree --no-commit-id --name-only -r HEAD | grep -qE '^(backend/|\.github/workflows/cd\.yml)'; then
            echo "Changes detected in backend/ or cd.yml. Proceeding to deploy."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in backend/. Skipping deployment."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    name: Deploy Backend to Heroku
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Heroku CLI
        run: |
          if ! command -v heroku &> /dev/null; then
            curl https://cli-assets.heroku.com/install.sh | sh
          fi

      - name: Log in to Heroku Container Registry
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "${HEROKU_API_KEY}" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build and Push Docker image
        env:
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          docker build -t registry.heroku.com/${HEROKU_APP_NAME}/web ./backend
          docker push registry.heroku.com/${HEROKU_APP_NAME}/web

      - name: Release Container to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          cat <<EOF > ~/.netrc
          machine api.heroku.com
            login _
            password ${HEROKU_API_KEY}
          machine git.heroku.com
            login _
            password ${HEROKU_API_KEY}
          EOF
          chmod 600 ~/.netrc

          echo "Setting stack to container..."
          heroku stack:set container --app "${HEROKU_APP_NAME}"

          echo "Releasing web container..."
          heroku container:release web --app "${HEROKU_APP_NAME}"
